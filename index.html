<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>הסרטים שלי</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#e50914">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#f5f5f7;--card:#fff;--text:#1c1c1e;--muted:#6e6e73;--accent:#e50914;--border:#d9d9de;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141414;--card:#222;--text:#f2f2f2;--muted:#9a9a9a;--border:#3a3a3a}}
:root[data-theme="dark"]{--bg:#141414;--card:#222;--text:#f2f2f2;--muted:#9a9a9a;--border:#3a3a3a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;min-height:100vh}
.wrap{max-width:600px;margin:0 auto;padding:16px}
h1{margin:8px 0 16px;font-size:26px}
.bar{display:flex;gap:8px}
input{width:100%;padding:13px 14px;font-size:16px;border:1px solid var(--border);border-radius:12px;background:var(--card);color:var(--text);outline:none}
input:focus{border-color:var(--accent)}
.plus{flex:0 0 50px;border:0;border-radius:12px;background:var(--accent);color:#fff;font-size:28px;line-height:1;cursor:pointer}
.add{display:none;margin-top:12px;padding:12px;background:var(--card);border:1px solid var(--border);border-radius:12px;gap:8px;flex-direction:column}
.add.open{display:flex}
.add button{padding:12px;border:0;border-radius:10px;background:var(--accent);color:#fff;font-size:16px;cursor:pointer}
.list{margin-top:16px;display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden}
.item a{flex:1;padding:16px;color:var(--text);text-decoration:none;font-size:17px}
.item button{border:0;background:none;color:var(--muted);font-size:20px;padding:16px;cursor:pointer}
.empty{text-align:center;color:var(--muted);margin-top:40px}
.item a{display:flex;align-items:center;gap:12px}
.thumb{width:48px;height:68px;object-fit:cover;border-radius:6px;flex:0 0 auto}
.pick{display:block;padding:12px;border:1px dashed var(--border);border-radius:10px;text-align:center;cursor:pointer;color:var(--muted)}
.prev{width:80px;height:auto;border-radius:8px;align-self:flex-start}

<body>
<div class="wrap">
  <h1>🎬 הסרטים שלי</h1>
  <div class="bar">
    <input id="q" type="search" placeholder="חפש סרט..." autocomplete="off">
    <button class="plus" id="plus" aria-label="הוסף סרט">+</button>
  </div>
  <div class="add" id="add">
    <input id="name" placeholder="שם הסרט" autocomplete="off">
    <input id="link" type="url" dir="ltr" placeholder="קישור לסרט" autocomplete="off">
    <label class="pick"><span id="pickTxt">📷 הוסף תמונה (אופציונלי)</span><input id="img" type="file" accept="image/*" hidden></label>
    <img id="prev" class="prev" alt="" hidden>
    <button id="save">שמור</button>
  </div>
  <div class="list" id="list"></div>
</div>
<script>
if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}
var movies=[];
try{movies=JSON.parse(localStorage.getItem("movies")||"[]")}catch(e){movies=[]}
function persist(){try{localStorage.setItem("movies",JSON.stringify(movies))}catch(e){}}
var $=function(id){return document.getElementById(id)};
function render(){
  var t=$("q").value.trim().toLowerCase(), box=$("list");
  box.innerHTML="";
  var res=movies.map(function(m,i){return{m:m,i:i}}).filter(function(x){return x.m.name.toLowerCase().indexOf(t)>-1});
  if(!res.length){box.innerHTML='<div class="empty">'+(movies.length?"לא נמצא סרט":"עוד אין סרטים. לחץ על + כדי להוסיף")+'</div>';return}
  res.forEach(function(x){
    var d=document.createElement("div");d.className="item";
    var a=document.createElement("a");a.href=x.m.link;a.target="_blank";a.rel="noopener";
    if(x.m.img){var im=document.createElement("img");im.src=x.m.img;im.className="thumb";a.appendChild(im)}
    var sp=document.createElement("span");sp.textContent=x.m.name;a.appendChild(sp);
    var b=document.createElement("button");b.textContent="✕";b.setAttribute("aria-label","מחק");
    b.onclick=function(){if(confirm("למחוק את "+x.m.name+"?")){movies.splice(x.i,1);persist();render()}};
    d.appendChild(a);d.appendChild(b);box.appendChild(d);
  });
}
function save(){
  var n=$("name").value.trim(), l=$("link").value.trim();
  if(!n||!l){(n?$("link"):$("name")).focus();return}
  if(!/^https?:\/\//i.test(l))l="https://"+l;
  movies.unshift({name:n,link:l,img:curImg});persist();
  $("name").value="";$("link").value="";curImg="";$("prev").hidden=true;$("img").value="";$("pickTxt").textContent="📷 הוסף תמונה (אופציונלי)";$("add").classList.remove("open");render();
}
$("plus").onclick=function(){var a=$("add");a.classList.toggle("open");if(a.classList.contains("open"))$("name").focus()};
$("save").onclick=save;
$("name").onkeydown=function(e){if(e.key==="Enter"){e.preventDefault();$("link").focus()}};
$("link").onkeydown=function(e){if(e.key==="Enter"){e.preventDefault();save()}};
var curImg="";
$("img").onchange=function(){var f=this.files&&this.files[0];if(!f)return;
  var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){
